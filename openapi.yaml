        total_minor:
          type: integer
          format: int64
          nullable: true
        total_mkd:
          type: number
          format: double
          nullable: true
        partial_total_minor:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
      required:
      - store_id
      - store_name
      - market
      - complete
      - covered_items
      - required_items
      - missing_items
      - total_minor
      - total_mkd
      - partial_total_minor
      - lines
      description: Only use total_minor/total_mkd when complete=true. Missing items give null totals.
    BasketResult:
      type: object
      properties:
        complete:
          type: boolean
        total_minor:
          type: integer
          format: int64
          nullable: true
        total_mkd:
          type: number
          format: double
          nullable: true
        stores:
          type: integer
          format: int64
        missing_items:
          type: array
          items:
            type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
          nullable: true
      required:
      - complete
      - total_minor
      - total_mkd
      - stores
      - missing_items
      - lines
      description: Split-basket result. Incomplete baskets have null totals.
    QuoteResponse:
      type: object
      properties:
        currency:
          type: string
          enum:
          - MKD
        calculated_at:
          type: string
          format: date-time
        match_policy:
          type: string
          enum:
          - exact_retailer_listing_only
          - includes_unverified_comparison_groups
        freshness_limit_hours:
          type: integer
          format: int64
        cheapest_single_store:
